name: Supply-chain audit

on:
  pull_request:
  push:
    branches: [main]
  # dependabot-lockfile.yml commits the regenerated bun.lock with the repository
  # GITHUB_TOKEN, and GitHub raises no `synchronize` for that push, so the audit
  # is dispatched against the refreshed branch instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # What lands on the default branch is the merge, not the branch. #1246
      # reached production that way: a pull request that had branched before a
      # dependency bump was updated onto the default branch, the update resolved
      # package.json and bun.lock to the branch's older side, and the revert rode
      # in under a description about something else. The checkout above is the
      # pull request's merge ref, so HEAD here is exactly what would land, and
      # the gate compares it against the base the merge sits on.
      #
      # The rule is about silence, not about change: a dependency version the
      # merge moves has to be named in the pull request's own title or body. An
      # ordinary bump names its packages already, so this stays quiet for the
      # changes people make deliberately.
      - name: Refuse a dependency change the merge does not declare
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          # A dispatched run carries no pull request payload, and the lockfile
          # half of the rule still has to hold for the branch it names against
          # the protected base.
          if [[ -z "$BASE_SHA" ]]; then
            git fetch --no-tags --force origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            BASE_SHA="$(git merge-base "refs/remotes/origin/${DEFAULT_BRANCH}" HEAD)"
          fi

          declaration=()
          if [[ -n "$PR_NUMBER" ]]; then
            # The title and body cross into the gate through the environment and
            # a file, so nothing a pull request writes is ever interpreted as
            # part of a command.
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "${RUNNER_TEMP}/declaration.md"
            declaration=(--declaration "${RUNNER_TEMP}/declaration.md")
          fi

          bun scripts/dependency-declaration-gate.ts --base "$BASE_SHA" --merge HEAD "${declaration[@]}"

      - name: Install production and development dependencies
        run: bun install --frozen-lockfile

      - name: Audit production and development dependencies
        shell: bash
        run: |
          set -euo pipefail

          audit_ids="$(bun -e '
          const fs = require("node:fs");

          const allowlist = JSON.parse(fs.readFileSync("security/audit-allowlist.json", "utf8"));
          const today = new Date().toISOString().slice(0, 10);
          const idPattern = /^(?:CVE-\d{4}-\d{4,}|GHSA-[a-z0-9]+(?:-[a-z0-9]+)+)$/i;
          const datePattern = /^\d{4}-\d{2}-\d{2}$/;
          const seen = new Set();

          if (!Array.isArray(allowlist)) {
            throw new Error("security/audit-allowlist.json must contain an array");
          }
          for (const [index, entry] of allowlist.entries()) {
            if (!entry || typeof entry !== "object") {
              throw new Error(`Allowlist entry ${index} must be an object`);
            }
            const id = typeof entry.id === "string" ? entry.id.trim() : "";
            const reason = typeof entry.reason === "string" ? entry.reason.trim() : "";
            const expires = entry.expires;
            if (!idPattern.test(id)) throw new Error(`Allowlist entry ${index} has an invalid advisory id`);
            if (!reason) throw new Error(`Allowlist entry ${index} must include a reason`);
            if (typeof expires !== "string" || !datePattern.test(expires)) {
              throw new Error(`Allowlist entry ${index} must include an ISO expiry date`);
            }
            const parsedExpiry = new Date(`${expires}T00:00:00Z`);
            if (parsedExpiry.toISOString().slice(0, 10) !== expires) {
              throw new Error(`Allowlist entry ${index} has an invalid expiry date`);
            }
            if (expires < today) throw new Error(`Allowlist entry ${id} expired on ${expires}`);
            if (seen.has(id.toUpperCase())) throw new Error(`Duplicate allowlist entry for ${id}`);
            seen.add(id.toUpperCase());
            console.error(`Allowlisting ${id} through ${expires}: ${reason}`);
            process.stdout.write(`${id}\n`);
          }
          '
          )"

          audit_args=()
          if [[ -n "$audit_ids" ]]; then
            while IFS= read -r advisory; do
              audit_args+=("--ignore=$advisory")
            done <<< "$audit_ids"
          fi
          bun audit --audit-level=high "${audit_args[@]}"
