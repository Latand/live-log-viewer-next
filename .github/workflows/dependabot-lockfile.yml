name: Dependabot lockfile refresh

# Dependabot's npm ecosystem rewrites package.json and never regenerates
# bun.lock, so with the lockfile-integrity rule from #1156 every dependency pull
# request fails `bun install --frozen-lockfile` before anyone can read it
# (#1183). This job regenerates bun.lock on the Dependabot branch and commits it
# through the repository GITHUB_TOKEN.
#
# Two things keep the write narrow. The branch must be unprotected, checked
# before any step can write. And the commit is a fast-forward from the exact
# revision this run inspected, so a branch that moved mid-run is refused rather
# than overwritten with a lockfile resolved from the package.json it replaced.
#
# GitHub raises no `synchronize` for a push made with that token, so the gates
# would never see the commit this job just wrote. The last step therefore
# dispatches them against the branch: a dispatched run reads the branch head,
# which is the exact commit its check run lands on, so it can never report on a
# revision it did not inspect.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    # The one job in this repository that holds a write token, so the trigger is
    # the fence: a pull request opened by Dependabot from a branch of this
    # repository. A branch a person named `dependabot/…`, and any fork, never
    # reaches the token.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      # `contents: write` is job-scoped, so refusing a protected branch has to be
      # a step, and it comes first: nothing this job does may touch a branch a
      # protection rule covers, however the branch is named and whoever opened
      # the pull request. GitHub refuses the ref update below for such a branch
      # anyway; this reports the reason instead of a REST error, and stops
      # before the branch's package.json is installed.
      - name: Refuse a protected head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${HEAD_REF}" --jq '.protected')"
          if [[ "$protected" != "false" ]]; then
            echo "::error::${HEAD_REF} is protected (protected=${protected}); refusing to write to it"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      # `--lockfile-only` resolves the bumped ranges and writes bun.lock without
      # unpacking a package, so nothing the pull request bumped executes in a job
      # that can write to the branch.
      - name: Regenerate bun.lock
        run: bun install --lockfile-only

      - name: Report whether bun.lock moved
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- bun.lock; then
            echo "bun.lock already resolves the bumped ranges"
            printf 'refreshed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'refreshed=true\n' >> "$GITHUB_OUTPUT"

      # The git data API commits as the bot the token already belongs to, which
      # is why this workflow writes no author identity of its own.
      #
      # The commit's parent is the revision the install read, and the ref update
      # asks for a fast-forward, so GitHub itself refuses to move a branch that
      # is no longer that revision. The lockfile a run resolved therefore only
      # ever lands on the package.json it was resolved from: a Dependabot
      # force-push arriving mid-run leaves the branch untouched, and the run its
      # push starts resolves the lockfile again.
      - name: Commit the refreshed lockfile
        if: steps.lockfile.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq '.object.sha')"
          if [[ "$branch_head" != "$HEAD_SHA" ]]; then
            echo "::notice::${HEAD_REF} moved to ${branch_head}; the run for that revision refreshes the lockfile"
            exit 0
          fi

          base_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')"

          blob="$(base64 -w 0 bun.lock \
            | jq -Rc '{ content: ., encoding: "base64" }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')"

          tree="$(jq -nc --arg base "$base_tree" --arg blob "$blob" \
            '{ base_tree: $base, tree: [{ path: "bun.lock", mode: "100644", type: "blob", sha: $blob }] }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha')"

          commit="$(jq -nc --arg tree "$tree" --arg parent "$HEAD_SHA" \
            '{ message: "chore(deps): refresh bun.lock", tree: $tree, parents: [$parent] }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha')"

          jq -nc --arg sha "$commit" '{ sha: $sha, force: false }' \
            | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" --input - --jq '.object.sha'

      - name: Run the gates on the refreshed head
        if: steps.lockfile.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run supply-chain.yml --ref "$HEAD_REF"
          gh workflow run privacy-publication.yml --ref "$HEAD_REF"
          gh workflow run privacy-tracker-audit.yml --ref "$HEAD_REF" -f "publication_number=${PR_NUMBER}"
