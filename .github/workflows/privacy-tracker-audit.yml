name: Privacy tracker audit

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      publication_number:
        description: Issue or pull request number to audit
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  privacy-tracker-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted audit implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      # A stalled apt mirror hung this step for 20+ minutes three times on
      # 2026-09-02 (#1456): fail fast with a hard timeout and one retry.
      - name: Install media inspection tools
        timeout-minutes: 4
        run: |
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          for attempt in 1 2; do
            if sudo apt-get $APT_OPTS update \
              && sudo apt-get $APT_OPTS install --yes ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-ukr; then
              exit 0
            fi
            echo "apt install attempt $attempt failed"
          done
          exit 1

      - name: Audit public tracker surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLV_PRIVACY_KNOWN_VALUE_FINGERPRINTS_FILE: scripts/privacy-known-value-fingerprints.json
          LLV_PRIVACY_OCR_LANGUAGES: eng+ukr
          PUBLICATION_ISSUE_COMMENT_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || '' }}
          PUBLICATION_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.publication_number }}
          PUBLICATION_REPO: ${{ github.repository }}
        run: |
          arguments=(--repo "$PUBLICATION_REPO" --number "$PUBLICATION_NUMBER")
          if [[ -n "$PUBLICATION_ISSUE_COMMENT_ID" ]]; then
            arguments+=(--issue-comment "$PUBLICATION_ISSUE_COMMENT_ID")
          fi
          bun scripts/privacy-github-audit.ts "${arguments[@]}" --report-only
