name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 24 already bundles npm >= 11.5.1 with its provenance deps (sigstore)
      # intact. Reinstalling npm@latest here intermittently ships a broken global
      # tree missing 'sigstore', which fails `npm publish` under trusted
      # publishing (MODULE_NOT_FOUND: sigstore). Use the bundled npm instead.
      - run: npm --version

      - name: Verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must use v-prefixed SemVer syntax: $RELEASE_TAG" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $package_version" >&2
            exit 1
          fi

          tag_object="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}")"
          tag_type="$(git cat-file -t "$tag_object")"
          if [ "$tag_type" != "tag" ]; then
            echo "Release ref refs/tags/${RELEASE_TAG} must be an annotated tag" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify HEAD)"
          remote_refs="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          remote_tag_object="$(awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }' <<<"$remote_refs")"
          remote_tag_commit="$(awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1 }' <<<"$remote_refs")"

          if [ -z "$remote_tag_object" ] || [ -z "$remote_tag_commit" ]; then
            echo "Remote annotated tag refs/tags/${RELEASE_TAG} could not be resolved exactly" >&2
            exit 1
          fi
          if [ "$tag_object" != "$remote_tag_object" ] || [ "$tag_commit" != "$remote_tag_commit" ]; then
            echo "Local tag identity does not match origin for refs/tags/${RELEASE_TAG}" >&2
            exit 1
          fi
          if [ "$checkout_commit" != "$tag_commit" ]; then
            echo "Checkout $checkout_commit does not match peeled tag commit $tag_commit" >&2
            exit 1
          fi

          echo "Verified refs/tags/${RELEASE_TAG} at tag object $tag_object and commit $tag_commit"

      - name: Check npm registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          error_file="$(mktemp "${RUNNER_TEMP}/npm-view.XXXXXX")"

          set +e
          published_json="$(npm view "${package_name}@${package_version}" version --json 2>"$error_file")"
          view_status=$?
          set -e

          if [ "$view_status" -eq 0 ]; then
            published_version="$(node -e '
              const value = JSON.parse(process.argv[1]);
              if (typeof value !== "string") throw new Error("npm returned a non-string version");
              process.stdout.write(value);
            ' "$published_json")"
            if [ "$published_version" != "$package_version" ]; then
              echo "Registry returned $published_version for ${package_name}@${package_version}" >&2
              exit 1
            fi
            exists=true
            echo "${package_name}@${package_version} already exists; publication will be skipped"
          elif grep -q 'E404' "$error_file"; then
            exists=false
            echo "${package_name}@${package_version} is absent and eligible for publication"
          else
            cat "$error_file" >&2
            exit "$view_status"
          fi

          printf 'package_name=%s\n' "$package_name" >> "$GITHUB_OUTPUT"
          printf 'package_version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.registry.outputs.exists == 'false'
        run: bun install --frozen-lockfile

      - name: Audit dependencies before publish
        if: steps.registry.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          audit_ids="$(bun -e '
          const fs = require("node:fs");

          const allowlist = JSON.parse(fs.readFileSync("security/audit-allowlist.json", "utf8"));
          const today = new Date().toISOString().slice(0, 10);
          const idPattern = /^(?:CVE-\d{4}-\d{4,}|GHSA-[a-z0-9]+(?:-[a-z0-9]+)+)$/i;
          const datePattern = /^\d{4}-\d{2}-\d{2}$/;
          const seen = new Set();

          if (!Array.isArray(allowlist)) {
            throw new Error("security/audit-allowlist.json must contain an array");
          }
          for (const [index, entry] of allowlist.entries()) {
            if (!entry || typeof entry !== "object") {
              throw new Error(`Allowlist entry ${index} must be an object`);
            }
            const id = typeof entry.id === "string" ? entry.id.trim() : "";
            const reason = typeof entry.reason === "string" ? entry.reason.trim() : "";
            const expires = entry.expires;
            if (!idPattern.test(id)) throw new Error(`Allowlist entry ${index} has an invalid advisory id`);
            if (!reason) throw new Error(`Allowlist entry ${index} must include a reason`);
            if (typeof expires !== "string" || !datePattern.test(expires)) {
              throw new Error(`Allowlist entry ${index} must include an ISO expiry date`);
            }
            const parsedExpiry = new Date(`${expires}T00:00:00Z`);
            if (parsedExpiry.toISOString().slice(0, 10) !== expires) {
              throw new Error(`Allowlist entry ${index} has an invalid expiry date`);
            }
            if (expires < today) throw new Error(`Allowlist entry ${id} expired on ${expires}`);
            if (seen.has(id.toUpperCase())) throw new Error(`Duplicate allowlist entry for ${id}`);
            seen.add(id.toUpperCase());
            console.error(`Allowlisting ${id} through ${expires}: ${reason}`);
            process.stdout.write(`${id}\n`);
          }
          '
          )"

          audit_args=()
          if [[ -n "$audit_ids" ]]; then
            while IFS= read -r advisory; do
              audit_args+=("--ignore=$advisory")
            done <<< "$audit_ids"
          fi
          bun audit --audit-level=high "${audit_args[@]}"

      - name: Verify npm signatures before publish
        if: steps.registry.outputs.exists == 'false'
        run: npm audit signatures

      - name: Build and inspect npm package
        id: package
        if: steps.registry.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$(mktemp -d "${RUNNER_TEMP}/npm-package.XXXXXX")"
          npm pack --pack-destination "$package_dir"

          mapfile -t tarballs < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected npm pack to produce exactly one tarball" >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          inventory="$package_dir/inventory.txt"
          tar -tzf "$tarball" > "$inventory"
          for required_entry in \
            package/package.json \
            package/bin/cli.mjs \
            package/bin/mcp-server.mjs \
            package/bin/server-runtime.mjs \
            package/dist/mcp-server.mjs \
            package/dist/standalone/server.js; do
            if ! grep -Fxq "$required_entry" "$inventory"; then
              echo "Package is missing required entry: $required_entry" >&2
              exit 1
            fi
          done

          extract_dir="$(mktemp -d "${RUNNER_TEMP}/npm-package-extract.XXXXXX")"
          tar -xzf "$tarball" -C "$extract_dir"
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(node "$extract_dir/package/bin/cli.mjs" --version)"
          if [ "$cli_version" != "$package_version" ]; then
            echo "Packaged CLI version $cli_version does not match $package_version" >&2
            exit 1
          fi
          cli_help="$(node "$extract_dir/package/bin/cli.mjs" --help)"
          if [[ "$cli_help" != *"Usage: agent-log-viewer"* ]]; then
            echo "Packaged CLI help is unavailable" >&2
            exit 1
          fi
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Run hermetic release gate
        if: steps.registry.outputs.exists == 'false'
        run: bun test bin/server-runtime.test.ts bin/mcp-server.test.ts docs/media/issue-626/evidence.test.ts

      - name: Publish package with OIDC
        id: publish
        if: steps.registry.outputs.exists == 'false'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.registry.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.registry.outputs.package_version }}
          PUBLISH_TAG: latest
        run: |
          set -euo pipefail

          publish_json="$(npm publish "${{ steps.package.outputs.tarball }}" --tag "$PUBLISH_TAG" --json)"
          printf '%s\n' "$publish_json"
          publish_integrity="$(node -e '
            const value = JSON.parse(process.argv[1]);
            const packageName = process.argv[2];
            const packageVersion = process.argv[3];
            const candidates = value && typeof value === "object"
              ? [value, ...Object.values(value)]
              : [];
            const published = candidates.find((candidate) =>
              candidate && typeof candidate === "object"
                && candidate.name === packageName
                && candidate.version === packageVersion
            );
            if (!published || typeof published.integrity !== "string" || published.integrity.length === 0) {
              throw new Error("npm publish returned no tarball integrity");
            }
            process.stdout.write(published.integrity);
          ' "$publish_json" "$PACKAGE_NAME" "$PACKAGE_VERSION")"
          printf 'integrity=%s\n' "$publish_integrity" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$PUBLISH_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify published package version
        id: verify
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.registry.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.registry.outputs.package_version }}
          PUBLISHED_THIS_RUN: ${{ steps.registry.outputs.exists == 'false' }}
          PUBLISH_TAG: ${{ steps.publish.outputs.tag || 'latest' }}
          EXPECTED_INTEGRITY: ${{ steps.publish.outputs.integrity }}
        run: |
          set -euo pipefail

          error_file="$(mktemp "${RUNNER_TEMP}/npm-verify.XXXXXX")"
          verify_delays=(5 10 20 30 45 60 75 90 120 120)
          visible=false

          for ((attempt = 0; attempt <= ${#verify_delays[@]}; attempt += 1)); do
            set +e
            published_json="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json 2>"$error_file")"
            view_status=$?
            set -e

            if [ "$view_status" -eq 0 ]; then
              published_version="$(node -e '
                const value = JSON.parse(process.argv[1]);
                if (typeof value !== "string") throw new Error("npm returned a non-string version");
                process.stdout.write(value);
              ' "$published_json")"
              if [ "$published_version" != "$PACKAGE_VERSION" ]; then
                echo "Registry returned $published_version for ${PACKAGE_NAME}@${PACKAGE_VERSION}" >&2
                exit 1
              fi
              visible=true
              break
            fi

            if ! grep -q 'E404' "$error_file"; then
              cat "$error_file" >&2
              echo "Registry verification failed for ${PACKAGE_NAME}@${PACKAGE_VERSION}" >&2
              exit "$view_status"
            fi

            if (( attempt < ${#verify_delays[@]} )); then
              delay="${verify_delays[$attempt]}"
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not visible yet; retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          if [ "$visible" = "true" ]; then
            dist_tags_json="$(npm view "$PACKAGE_NAME" dist-tags --json)"
            published_tag_version="$(node -e '
              const value = JSON.parse(process.argv[1]);
              const tag = process.argv[2];
              if (!value || typeof value !== "object" || typeof value[tag] !== "string") {
                throw new Error(`npm returned no ${tag} dist-tag`);
              }
              process.stdout.write(value[tag]);
            ' "$dist_tags_json" "$PUBLISH_TAG")"
            if [ "$published_tag_version" != "$PACKAGE_VERSION" ]; then
              echo "Registry dist-tag ${PUBLISH_TAG} points at ${published_tag_version}, expected ${PACKAGE_VERSION}" >&2
              exit 1
            fi

            integrity_json="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity --json)"
            published_integrity="$(node -e '
              const value = JSON.parse(process.argv[1]);
              if (typeof value !== "string" || value.length === 0) {
                throw new Error("npm returned no dist.integrity");
              }
              process.stdout.write(value);
            ' "$integrity_json")"
            if [ "$PUBLISHED_THIS_RUN" = "true" ]; then
              if [ -z "$EXPECTED_INTEGRITY" ]; then
                echo "The successful publish produced no integrity output" >&2
                exit 1
              fi
              if [ "$published_integrity" != "$EXPECTED_INTEGRITY" ]; then
                echo "Registry dist.integrity does not match the published tarball" >&2
                exit 1
              fi
            fi

            printf 'visibility=visible\n' >> "$GITHUB_OUTPUT"
            echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION}, dist-tag ${PUBLISH_TAG}, and dist.integrity in the npm registry"
            exit 0
          fi

          if [ "$PUBLISHED_THIS_RUN" = "true" ]; then
            message="Published ${PACKAGE_NAME}@${PACKAGE_VERSION}, not yet visible after registry verification polling. Do not publish or retag it again."
            echo "::warning title=Published, not yet visible::$message"
            {
              echo "### Published, not yet visible"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'visibility=pending\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$error_file" >&2
          echo "Timed out waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to become visible" >&2
          exit 1
